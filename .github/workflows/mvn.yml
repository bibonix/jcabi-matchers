---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  mvn:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        java: [21]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - run: java -version
      - run: mvn -version
      - run: |
          mvn --errors --batch-mode clean install -Pqulice 2>&1 | tee /tmp/mvn.log
        continue-on-error: true
        id: mvn
      - name: Show failures in summary
        if: always()
        run: |
          {
            echo "## Maven outcome: ${{ steps.mvn.outcome }}"
            echo ""
            echo "## Last 200 lines"
            echo '```'
            tail -200 /tmp/mvn.log
            echo '```'
            if ls target/surefire-reports/*.txt > /dev/null 2>&1; then
              echo "## Surefire txt reports"
              for f in target/surefire-reports/*.txt; do
                echo "### $f"
                echo '```'
                cat "$f"
                echo '```'
              done
            fi
          } >> $GITHUB_STEP_SUMMARY
      - name: Fail if mvn failed
        if: steps.mvn.outcome != 'success'
        run: exit 1
