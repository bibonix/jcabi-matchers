---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  mvn:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        java: [21]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - run: java -version
      - run: mvn -version
      - shell: bash
        run: |
          set -o pipefail
          mvn --errors --batch-mode clean install -Pqulice 2>&1 | tee /tmp/mvn.log
        continue-on-error: true
        id: mvn
      - shell: bash
        if: always()
        run: |
          echo "=== TAIL OF MVN LOG ==="
          tail -120 /tmp/mvn.log
          echo "=== END ==="
          # Single annotation with tail of log compressed
          msg=$(tail -100 /tmp/mvn.log | tr -d '\r' | tr '\n' '|' | head -c 4000)
          echo "::error::MVN_TAIL: ${msg}"
      - shell: bash
        if: steps.mvn.outcome != 'success'
        run: exit 1
