---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  mvn:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        java: [21]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - run: java -version
      - run: mvn -version
      - shell: bash
        run: |
          set -o pipefail
          mvn --errors --batch-mode clean install -Pqulice 2>&1 | tee /tmp/mvn.log
        continue-on-error: true
        id: mvn
      - shell: bash
        if: always()
        run: |
          # Emit annotations for every failure line
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # Only emit if the file shows Failures>0 or Errors>0
            if grep -qE "Failures: [^0]|Errors: [^0]" "$f"; then
              while IFS= read -r line; do
                # Emit a workflow notice line (no newlines allowed in annotations)
                echo "::error file=$base::${line//$'\n'/ }"
              done < <(head -200 "$f" | tr '\n' ' ' | head -c 2000; echo "")
            fi
          done
      - shell: bash
        if: steps.mvn.outcome != 'success'
        run: |
          echo "Maven failed; see annotations above"
          exit 1
