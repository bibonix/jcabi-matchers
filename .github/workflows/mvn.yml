---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  mvn:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        java: [21]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - run: java -version
      - run: mvn -version
      - shell: bash
        run: |
          set -o pipefail
          mvn --errors --batch-mode clean install -Pqulice 2>&1 | tee /tmp/mvn.log
        continue-on-error: true
        id: mvn
      - name: Show outcome
        if: always()
        run: |
          {
            echo "## Maven outcome: ${{ steps.mvn.outcome }}"
            echo ""
            echo "## Tail of mvn output (300 lines)"
            echo '```'
            tail -300 /tmp/mvn.log
            echo '```'
            echo "## Surefire reports"
            for f in target/surefire-reports/*.txt; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                cat "$f"
                echo '```'
              fi
            done
          } >> $GITHUB_STEP_SUMMARY
